<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Spin — 命運大轉盤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <h1>🎯 Lucky Spin</h1>
  <p>命運大轉盤 — 自訂選項，讓命運替你決定</p>
</header>

<main class="layout">
  <section class="card panel" aria-labelledby="panel-title">
    <h2 id="panel-title">抽籤選項 <span id="count" class="badge"></span></h2>
    <div class="add-row">
      <input id="item-input" type="text" placeholder="輸入新選項（最多 20 字）" autocomplete="off" aria-label="新選項名稱">
      <button id="add-btn" class="btn btn-primary" type="button">新增</button>
    </div>
    <p id="error" class="error" role="alert"></p>
    <ul id="item-list" class="item-list"></ul>
    <button id="restore-btn" class="btn btn-ghost" type="button">恢復預設選項</button>
  </section>

  <section class="card stage" aria-label="轉盤">
    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="600" height="600" role="img" aria-label="抽籤轉盤"></canvas>
    </div>
    <button id="spin-btn" class="btn btn-spin" type="button">開始旋轉</button>
  </section>

  <section class="card history" aria-labelledby="history-title">
    <div class="history-head">
      <h2 id="history-title">最近抽籤紀錄</h2>
      <button id="clear-btn" class="btn btn-ghost" type="button">清除紀錄</button>
    </div>
    <ol id="history-list" class="history-list"></ol>
  </section>
</main>

<div id="modal" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <h2 id="modal-title">命運揭曉！</h2>
    <p>你抽中了</p>
    <p id="result" class="result"></p>
    <button id="ok-btn" class="btn btn-primary" type="button">確定</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
